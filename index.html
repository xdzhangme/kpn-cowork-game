<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2300C300'/%3E%3Crect x='3' y='3' width='10' height='10' fill='%23ffffff'/%3E%3C/svg%3E" />
    <title>KPN Cowork game</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="hd">
      <img class="logo" id="logo" src="/kpn-logo.svg" alt="KPN" />
      <span class="badge" id="badge"></span>
      <b id="company"></b>
      <span class="hd-sub" data-i18n="header.sub"></span>
      <span class="sp"></span>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="nl">NL</button>
      </div>
      <button type="button" class="dis dis--guide" id="guide-btn" data-i18n="header.guide"></button>
      <button type="button" class="dis" id="disclaimer-btn" data-i18n="disclaimer.button"></button>
    </header>

    <nav class="tabs" role="tablist" data-i18n-aria="tabs.label">
      <button type="button" role="tab" id="tab-game" aria-controls="panel-game" data-tab="game" data-i18n="tab.game"></button>
      <button type="button" role="tab" id="tab-library" aria-controls="panel-library" data-tab="library" data-i18n="tab.library"></button>
      <button type="button" role="tab" id="tab-start" aria-controls="panel-start" data-tab="start" data-i18n="tab.start"></button>
      <button type="button" role="tab" id="tab-rai" aria-controls="panel-rai" data-tab="rai" data-i18n="tab.rai"></button>
    </nav>

    <main>
      <section role="tabpanel" id="panel-game" aria-labelledby="tab-game">
        <div class="game-layout">
          <div class="game-viewport" id="viewport"><canvas id="game"></canvas></div>
          <aside class="game-card px-panel" id="card" tabindex="-1" aria-live="polite"></aside>
        </div>
        <nav class="px-bottom-bar" id="bottom-bar" aria-label="Game actions"></nav>
      </section>
      <section role="tabpanel" id="panel-library" aria-labelledby="tab-library" hidden>
        <a class="skip" href="#lib-results" data-i18n="skip.results"></a>
        <div id="library-list" class="pane kpn-doc"></div>
      </section>
      <section role="tabpanel" id="panel-start" aria-labelledby="tab-start" hidden>
        <div id="start-pane" class="kpn-doc"></div>
      </section>
      <section role="tabpanel" id="panel-rai" aria-labelledby="tab-rai" hidden>
        <div id="rai-pane" class="kpn-doc"></div>
      </section>
    </main>

    <dialog id="disclaimer-dialog">
      <div data-content="disclaimer"></div>
      <button type="button" class="dis" id="disclaimer-close" data-i18n="dialog.close"></button>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
